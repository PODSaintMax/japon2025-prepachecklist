<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japon 2025 — Checklist Pré-Départ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1208;--cream:#f7f3ed;--red:#c8372d;--gold:#c49a2e;--muted:#7a6e63;--border:#ddd5c8;--green:#3a7d44}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'Noto Serif',serif;font-size:15px;line-height:1.6;padding-bottom:3rem}
.hdr{background:var(--ink);color:var(--cream);padding:2rem 1.25rem 1.5rem;text-align:center}
.hdr .kanji{font-size:.85rem;opacity:.35;letter-spacing:.3em;margin-bottom:.5rem}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.6rem;letter-spacing:.02em;margin-bottom:.3rem}
.hdr .sub{font-size:.78rem;color:var(--gold);letter-spacing:.08em}
.prog-wrap{max-width:780px;margin:0 auto;padding:1rem 1.25rem 0;position:sticky;top:0;background:var(--cream);z-index:50;border-bottom:1px solid var(--border)}
.prog-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:.4rem}
.prog-fill{height:100%;background:var(--gold);width:0;transition:width .3s}
.prog-txt{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:.6rem}

/* --- SAUVEGARDE --- */
.sync{max-width:780px;margin:.8rem auto 0;padding:0 1.25rem}
.btn{font-family:inherit;font-size:.74rem;font-weight:600;border-radius:.45rem;padding:.5rem .8rem;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.saved-note{font-size:.68rem;color:var(--muted);margin-top:.45rem;font-style:italic;min-height:.9rem}

main{max-width:780px;margin:0 auto;padding:1rem 1.25rem}
.phase{margin-bottom:1.5rem;border:1px solid var(--border);border-radius:.6rem;overflow:hidden;background:#fff}
.ph-h{padding:.85rem 1.1rem;font-family:'Playfair Display',serif;font-size:1.05rem;color:#fff;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.ph-h.ink{background:var(--ink)}.ph-h.green{background:var(--green)}
.ph-h .count{font-family:'Noto Serif',serif;font-size:.72rem;opacity:.85;font-weight:400}
.ph-body{padding:.4rem 0}
.task{display:flex;align-items:flex-start;gap:.75rem;padding:.6rem 1.1rem;border-bottom:1px solid #f0ebe3;cursor:pointer;transition:background .12s}
.task:last-child{border-bottom:none}
.task:hover{background:#faf7f1}
.task .box{flex:0 0 22px;height:22px;border:2px solid var(--border);border-radius:5px;margin-top:1px;position:relative;transition:all .15s}
.task.done .box{background:var(--green);border-color:var(--green)}
.task.done .box::after{content:'✓';position:absolute;top:-2px;left:3px;color:#fff;font-size:15px;font-weight:700}
.task .txt{flex:1}
.task .t-main{font-size:.92rem;line-height:1.35;transition:all .15s}
.task.done .t-main{text-decoration:line-through;color:var(--muted)}
.task .t-detail{font-size:.76rem;color:var(--muted);margin-top:.15rem;line-height:1.4}
.task .t-detail a{color:var(--red);text-decoration:none;border-bottom:1px solid rgba(200,55,45,.3)}
footer{text-align:center;padding:1.5rem 1rem;font-size:.72rem;color:var(--muted);line-height:1.6}
.reset{display:inline-block;margin-top:.6rem;padding:.4rem .9rem;border:1px solid var(--border);border-radius:.4rem;background:#fff;color:var(--muted);font-family:inherit;font-size:.72rem;cursor:pointer}
.reset:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<header class="hdr">
<div class="kanji">出発前チェックリスト</div>
<h1>Checklist Pré-Départ</h1>
<div class="sub">Japon · Famille × 4 · Départ 17 juillet → Haneda 18 juillet 8h10</div>
</header>

<div class="prog-wrap">
<div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
<div class="prog-txt" id="pt">0 / 0 tâches complétées</div>
</div>

<div class="sync">
  <button class="btn btn-primary" id="btnSave">💾 Sauvegarder</button>
  <div class="saved-note" id="savedNote"></div>
</div>

<main id="main"></main>

<footer>
Sauvegarde automatique sur cet appareil à chaque case cochée.<br>
<button class="reset" onclick="resetAll()">Réinitialiser la checklist</button>
</footer>

<script>
const data = [
{phase:"📅 J-30 — Maintenant (mi-juin)", cls:"ink", tasks:[
["Confirmer Airbnb Unoan Kyoto","24-27 juil. · Annulation gratuite avant le 18 juillet"],
["Confirmer Rakuten Stay Terrace Hakone","22-24 juil. · Annulation gratuite avant le 17 juillet"],
["Réserver Shinkansen Odawara → Kyoto","<a href='https://smartex.jr-central.co.jp/en/' target='_blank'>SmartEX</a> — créer compte + enregistrer carte"],
["Réserver Shinkansen Osaka → Tokyo","<a href='https://smartex.jr-central.co.jp/en/' target='_blank'>SmartEX</a> — même session"],
["Réserver Romancecar Shinjuku → Hakone","<a href='https://www.odakyu.jp/english/romancecar/' target='_blank'>odakyu.jp</a> — 22 juil., départ 9h30-10h30"],
["Réserver TeamLab Borderless","<a href='https://borderless.teamlab.art/tickets/' target='_blank'>borderless.teamlab.art</a> — créneau 17h-17h30 le 30 juil."],
["Réserver Kawadoko Kibune","<a href='https://tableall.com' target='_blank'>tableall.com</a> — 25 juil. midi (Hiroya/Beniya/Fujiya)"],
["Vérifier validité passeports × 4","Valides au moins 6 mois après le 1er août 2026"],
["Créer compte Visit Japan Web","<a href='https://vjw.digital.go.jp' target='_blank'>vjw.digital.go.jp</a> — immigration + douane × 4"],
["Activer option Sobrio internationale SG","Espace client ou agence — POUR JUILLET UNIQUEMENT"],
["Prévenir la SG du voyage au Japon","18 juil.-1er août — éviter blocage anti-fraude"],
["Vérifier compatibilité eSIM des 4 téléphones","Réglages → Données cellulaires → Ajouter forfait eSIM"],
["Acheter 2× Nomad Unlimited 15 jours","<a href='https://www.nomadesim.com/japan-eSIM' target='_blank'>nomadesim.com</a> — code JAPANTRAVEL (5%) — adultes"],
["Acheter 2× MobiMatter 10 GB","<a href='https://mobimatter.com' target='_blank'>mobimatter.com</a> — garçons"],
["Réserver parking aéroport Frankfurt","Voiturier ou navette — réserver TÔT (été = complet vite)"],
]},
{phase:"📅 J-14 — Début juillet", cls:"ink", tasks:[
["Google Maps + carte offline Japon","Profil → Cartes hors connexion → Tokyo/Hakone/Kyoto/Osaka"],
["Google Translate + pack japonais offline","Paramètres → Téléchargement hors connexion → 日本語"],
["Installer GO Taxi (アプリ GO)","App taxi japonaise + enregistrer carte bancaire"],
["Installer SmartEX","Billets shinkansen numériques (QR aux portiques)"],
["Installer Tabelog","Guide restaurant japonais fiable (scores /5)"],
["Installer XE Currency","Convertisseur EUR ↔ JPY, fonctionne offline"],
["Installer Navitime for Japan Travel","Navigation transports (quais, correspondances)"],
["Configurer Suica sur Apple Wallet (iPhones)","Wallet → + → Carte transport → Suica → charger ¥2 500"],
["Prévoir carte Suica physique (Android)","Android FR pas de FeliCa → carte physique à Haneda"],
["Préparer les 4 sacs","2 grands (Takkyubin) + 2 sacs à dos (Hakone autonomie)"],
["Imprimer adresses hôtels en japonais","Pour les chauffeurs de taxi — 5 hébergements"],
["Carnet adresses + numéros urgence","Ambassade FR 03-5798-6000 · police 110 · ambulance 119"],
]},
{phase:"📅 J-7 — Semaine avant", cls:"ink", tasks:[
["Scanner les 4 QR codes eSIM (WiFi maison)","Réglages → Ajouter eSIM → nommer 'Japon' → laisser désactivé"],
["NE PAS activer les données eSIM","Activation dans l'avion uniquement"],
["NE PAS supprimer les QR codes eSIM","Une eSIM supprimée ne peut pas être réinstallée"],
["Vérifier toutes les confirmations","Shinkansen, Romancecar, TeamLab, Kibune"],
["Sauvegarder confirmations en PDF offline","Sur chaque téléphone"],
["Récupérer code d'accès Rakuten Stay","Arrive par email 24h avant check-in (le 21 juillet)"],
]},
{phase:"📅 J-2 — Avant-veille", cls:"ink", tasks:[
["Vérifier météo Tokyo 18-22 juillet","Adapter vêtements sac à dos si besoin"],
["Compléter Visit Japan Web (si pas fait)","QR codes immigration + douane prêts × 4"],
["Charger tous les appareils","Téléphones, batterie 20 000 mAh, tablettes, console"],
["Télécharger contenus offline avion","Films, séries, jeux, musique"],
["Vérifier Suica Apple Wallet chargées",""],
["Check final documents","Passeports, cartes, billets avion, confirmations"],
]},
{phase:"📅 J-0 — Jour du départ (17 juillet)", cls:"green", tasks:[
["Vérifier sacs à dos = autonomie Hakone 2 nuits","Les grands sacs partent en soute"],
["AVION : activer les 4 eSIM (30 min avant atterrissage)","Ligne Japon ON + Roaming ON + désactiver data FR"],
["AVION : préparer QR code Visit Japan Web","Immigration prêt à scanner"],
]},
{phase:"🛬 Arrivée Haneda — 18 juillet 8h10", cls:"green", tasks:[
["1. Immigration","Scanner QR Visit Japan Web aux bornes / file passeports UE"],
["2. Récupérer les bagages","Zone de livraison"],
["3. Douane","Scanner QR code douane Visit Japan Web"],
["4. Tester l'eSIM","Ouvrir Google Maps, vérifier la connexion data"],
["5. Suica physique si besoin (Android)","Distributeurs B1F Terminal 3 — charger ¥3 000/carte"],
["6. Premier retrait cash au 7-Eleven","¥50 000-100 000 — DAB 7-Eleven Terminal 3"],
["7. Monorail → Hamamatsucho → JR → Suidobashi","Le voyage commence !"],
]},
];

const main = document.getElementById('main');
let total = 0;
const state = {};
const LS_KEY = 'checklist_pre_depart_japon_2025';

/* ---------- Persistance locale ---------- */
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    localStorage.setItem(LS_KEY+'_ts', new Date().toISOString());
    showSaved();
    return true;
  }catch(e){ return false; }
}
function loadLocal(){
  try{ const s=localStorage.getItem(LS_KEY); if(s) Object.assign(state, JSON.parse(s)); }catch(e){}
}
function showSaved(){
  const n=document.getElementById('savedNote'); if(!n) return;
  try{
    const ts=localStorage.getItem(LS_KEY+'_ts');
    if(ts){
      const d=new Date(ts);
      n.textContent='Sauvegardé sur cet appareil · '+d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    } else { n.textContent=''; }
  }catch(e){ n.textContent='Enregistrement local indisponible ici — la version hébergée sur GitHub le fera.'; }
}

loadLocal();

data.forEach((ph,pi)=>{
  const phase = document.createElement('div');
  phase.className = 'phase';
  const head = document.createElement('div');
  head.className = 'ph-h '+ph.cls;
  head.innerHTML = `<span>${ph.phase}</span><span class="count" id="c${pi}"></span>`;
  phase.appendChild(head);
  const body = document.createElement('div');
  body.className = 'ph-body';
  ph.tasks.forEach((t,ti)=>{
    const id = `t_${pi}_${ti}`;
    total++;
    const task = document.createElement('div');
    task.className = 'task'+(state[id]?' done':'');
    task.innerHTML = `<div class="box"></div><div class="txt"><div class="t-main">${t[0]}</div>${t[1]?`<div class="t-detail">${t[1]}</div>`:''}</div>`;
    task.onclick = (e)=>{ if(e.target.tagName==='A')return; state[id]=!state[id]; task.classList.toggle('done'); save(); };
    body.appendChild(task);
  });
  phase.appendChild(body);
  main.appendChild(phase);
});

function save(){ saveLocal(); update(); }
function update(){
  let done=0;
  data.forEach((ph,pi)=>{
    let pdone=0;
    ph.tasks.forEach((t,ti)=>{ if(state[`t_${pi}_${ti}`]){done++;pdone++;} });
    document.getElementById('c'+pi).textContent = `${pdone}/${ph.tasks.length}`;
  });
  const pct = total?Math.round(done/total*100):0;
  document.getElementById('pf').style.width = pct+'%';
  document.getElementById('pt').textContent = `${done} / ${total} tâches complétées · ${pct}%`;
}
function resetAll(){ if(confirm('Réinitialiser toutes les cases ?')){ Object.keys(state).forEach(k=>delete state[k]); document.querySelectorAll('.task').forEach(t=>t.classList.remove('done')); save(); } }

document.getElementById('btnSave').onclick=()=>{
  const b=document.getElementById('btnSave');
  const ok=saveLocal();
  b.textContent = ok ? '✓ Sauvegardé' : '⚠️ Non enregistré';
  setTimeout(()=>b.textContent='💾 Sauvegarder',1600);
};

update();
showSaved();
</script>
</body>
</html>
